    '#type': processed_text
    '#format': full_html
    '#text': |-
      <p align="center">
      	<strong>2019 Grape Day</strong><br />
      	LaSells Stewart Center, OSU Campus, Wednesday, April 3<br />
      	For maps and parking information, click&nbsp;<a href="https://lasells.oregonstate.edu/parking">here</a>.<br />
      	Registration:&nbsp;$150/person, includes lunch and a research abstract booklet&nbsp;<br />
      	Registration Closes: March 22, 2019, 5PM<br />
      	&nbsp;</p>

      <p>
      	Join us on campus at Oregon State University for our annual event highlighting research relevant to the Oregon Wine Industry. This information will be presented by members of the Oregon Wine Research Institute and guest speakers from the University of California Cooperative Extension and Washington State University.&nbsp;<br />
      	&nbsp;</p>

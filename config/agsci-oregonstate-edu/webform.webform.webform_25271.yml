      <p><a href="http://agsci.oregonstate.edu/applied-economics/aecgradprogram">Graduate Program Home Page</a></p>
      <p><a href="http://agsci.oregonstate.edu/appliedecon/">Applied Economics Home Page</a></p>
      <p style="text-align: center;"><strong>Application for Graduate Assistantship Funding for Transfer Students </strong></p>
      <p style="text-align: center;"><strong>Graduate Program in Applied Economics<br></strong></p>
      <p style="text-align: center;"><strong>Applied Economics Department</strong></p>
      <p>Directions: If you are transferring to the Graduate Program in Applied Economics from another OSU graduate program and would like to apply for an assistantship, please submit this form<a href="mailto:tjrichardson@oregonstate.edu"></a>. Assistantships are awarded competitively.</p>

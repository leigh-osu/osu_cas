      value:
        plugin: format_date
        from_format: 'Y-m-d H:i:s'
        to_format: 'Y-m-d\TH:i:s'
        source: value
  field_vid_show_on_profile:
    plugin: sub_process
    source: field_show_on_profile
    process:
      target_id:
        -
          plugin: migration_lookup
          migration: upgrade_d7_user_to_profile
          source: target_id
          no_stub: true
        -
          plugin: skip_on_empty
          method: process
  field_vid_video:

    '#type': textarea
    '#title': 'Personal Development (How will this experience contribute to both your leadership development goals and your career goals?)'
    '#required': true
  experience_details:
    '#type': processed_text
    '#format': full_html
    '#text': '<p><em>Please fill in the following information on the experience details. <br /></em></p>'
  start_date:
    '#type': textfield
    '#unique': false
    '#title_display': inline
    '#title': 'Start Date'
    '#required': true
  end_date:
    '#type': textfield
    '#unique': false
    '#title_display': inline
    '#title': 'End Date'
    '#required': true
  approximate_hours_per_week:
    '#type': textfield
    '#unique': false
    '#title_display': inline
    '#title': 'Approximate Hours Per Week'
    '#required': true
  approximate_number_of_weeks:
    '#type': textfield
    '#unique': false
    '#title_display': inline
    '#title': 'Approximate Number of Weeks'
    '#required': true
  approximate_total_hours:
    '#type': textfield
    '#unique': false
    '#title_display': inline
    '#title': 'Approximate Total Hours'
    '#required': true
  credit_hours_if_known:
    '#type': textfield
    '#title_display': inline
    '#title': 'Credit Hours (if known)'
  met_with_a_leadership_minor_advisor:
    '#type': radios
    '#options':
      haley.traini@oregonstate.edu: 'Haley Traini'
      dawn.moyer@oregonstate.edu: 'Dawn Moyer'
      jonathan.velez@oregonstate.edu: 'Jonathan Velez'
      leadershipminor@oregonstate.edu: 'I have not met with an advisor about my proposal'
    '#title': 'If you have met with a Leadership Minor advisor about your proposal prior to submitting this document please indicate that individual below'
  supervisor_verification_form:
    '#type': processed_text
    '#format': full_html
    '#text': '<p><span>Link to&nbsp;<a href="http://agsci.oregonstate.edu/sites/agsci/files/leadership-minor/supervisor_verification_form.docx">Supervisor Verification Form</a>.</span></p>'
  completed_supervisor_verification_form:
    '#type': managed_file
    '#max_filesize': 2.0
    '#file_extensions': 'gif jpg jpeg png pdf doc'
    '#title_display': inline
    '#title': 'Completed Supervisor Verification Form'
  supervisor_verification_form_is_attached:
    '#type': radios
    '#options':
      '01': ' Yes, a completed Supervisor Verification Form is attached'
      '02': ' No, I was unable to submit Supervisor Verification Form'
    '#title': 'Supervisor Verification Form is attached '
    '#required': true
  why_didnt_you_submit_the_supervisor_verification_form:
    '#type': textarea
    '#title': "Why didn't you submit the Supervisor Verification Form?"
    '#states':
      visible:
        - ':input[name="supervisor_verification_form_is_attached"]':
            value: '02'

elements: |-
  instructions:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <h6>
      	Congratulations on being recommended!&nbsp;<span style="caret-color:#000000"><span style="color:#000000"><span style="font-family:-webkit-standard"><span style="font-style:normal"><span style="font-variant-caps:normal"><span style="font-weight:normal"><span style="letter-spacing:normal"><span style="orphans:auto"><span style="text-transform:none"><span style="white-space:normal"><span style="widows:auto"><span style="word-spacing:0px"><span style="-webkit-text-size-adjust:auto"><span style="text-decoration:none"><i><span style="font-size:12pt"><span style="font-family:&quot;Kievit Offc&quot;, sans-serif"><span style="color:black"></span></span></span></i></span></span></span></span></span></span></span></span></span></span></span></span></span></span></h6>

      <p>
      	Faces of AgSci is a spotlight series that showcases the outstanding students, faculty, alumni and industry partners who make up the College of Agricultural Sciences. It is an opportunity for us to and celebrate the diversity of the remarkable community of agricultural sciences in Oregon.&nbsp;</p>

      <p>
      	We want to hear about the great work you are doing and your motivation for doing it. This is also a chance for you to inspire others to pursue their passions and achieve their goals.</p>

      <p>
      	&nbsp;</p>

      <h3>
      	The Process</h3>

      <p>
      	1) Fill out the questionnaire below the best you can. *Don't feel obligated to answer every single question. Just the ones that compel you.</p>

      <p>
      	2) Download the model release form, sign it and upload it below. (It allows us to publish your story on the web and social media).</p>

      <p>
      	3) Upload your best pictures -- about 8-10 is ideal. The best pictures for web publishing are horizontally-framed and show your face clearly—but more importantly, they give a sense of context and setting and show your personality! *Please make sure each picture is at least 1MB in size!*</p>

      <p>
      	&nbsp;</p>

      <p>
      	<a class="btn btn-primary" href="/sites/agscid7/files/osu-model-release-2017-shortform.pdf">Model release form</a></p>

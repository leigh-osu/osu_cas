      <p>
      	&nbsp;</p>

      <h5 style="margin-bottom: 11px; text-align: center;">
      	<em><strong>REGISTRATION IS NOW CLOSED! Thank you for your interest!&nbsp;</strong></em></h5>

      <p style="margin-bottom: 11px; text-align: center;">
      	<strong><span style="font-size:11pt"><span style="line-height:107%"><span style="font-family:Calibri,sans-serif"><span style="font-size:12.0pt"><span style="line-height:107%"><span style="font-family:&quot;Arial&quot;,sans-serif">2022 Agricultural Biodiversity on Western Farms -&nbsp;</span></span></span></span></span></span><span style="font-size:12.0pt"><span style="line-height:107%"><span style="font-family:&quot;Arial&quot;,sans-serif">Habitat Working for Farmers </span></span></span></strong></p>

      <p style="margin-bottom: 11px; text-align: center;">
      	<strong><span style="font-size:11pt"><span style="line-height:107%"><span style="font-family:Calibri,sans-serif"><span style="font-size:12.0pt"><span style="line-height:107%"><span style="font-family:&quot;Arial&quot;,sans-serif">Tuesday May 24<sup>th</sup> and Wednesday May 25th, 2022 -&nbsp;&nbsp;</span></span></span></span></span></span><span style="font-size:12.0pt"><span style="line-height:107%"><span style="font-family:&quot;Arial&quot;,sans-serif">8:00 AM&nbsp;– 12:00 PM</span></span></span></strong></p>

      <p style="margin-bottom: 11px; text-align: center;">
      	<strong>Free event - Registration Required</strong><br />
      	&nbsp;</p>

      <p style="text-align: center;">
      	<a class="btn btn-large btn-stratosphere color-active" href="https://agsci.oregonstate.edu/2022-agricultural-biodiversity-western-farms-links-and-resources">Conference Resources and Handouts</a></p>

      <p>
      	&nbsp;</p>

      <p>
      	<span style="font-size:12.0pt"><span style="line-height:107%"><span style="font-family:&quot;Arial&quot;,sans-serif">A free virtual conference on practices to develop habitats that conserve agricultural biodiversity and their benefits in western farming systems for farmers, conservationists, and other agricultural professionals.&nbsp;</span></span></span></p>

      <p style="margin-bottom:11px">
      	<span style="font-size:11pt"><span style="line-height:107%"><span style="font-family:Calibri,sans-serif"><span style="font-size:12.0pt"><span style="line-height:107%"><span style="font-family:&quot;Arial&quot;,sans-serif">Presenting:</span></span></span></span></span></span></p>

      <ul>
      	<li style="margin-left:8px">
      		<span style="font-size:11pt"><span style="line-height:107%"><span style="font-family:Calibri,sans-serif"><span style="font-size:12.0pt"><span style="line-height:107%"></span></span><span style="font-size:12.0pt"><span style="line-height:107%"><span style="font-family:&quot;Arial&quot;,sans-serif">Farmer preferred habitats and practices</span></span></span></span></span></span></li>
      	<li style="margin-left:8px">
      		<span style="font-size:11pt"><span style="line-height:107%"><span style="font-family:Calibri,sans-serif"><span style="font-size:12.0pt"><span style="line-height:107%"></span></span><span style="font-size:12.0pt"><span style="line-height:107%"><span style="font-family:&quot;Arial&quot;,sans-serif">Best methods and plants for practices</span></span></span></span></span></span></li>
      	<li style="margin-bottom:11px; margin-left:8px">
      		<span style="font-size:11pt"><span style="line-height:107%"><span style="font-family:Calibri,sans-serif"><span style="font-size:12.0pt"><span style="line-height:107%"></span></span><span style="font-size:12.0pt"><span style="line-height:107%"><span style="font-family:&quot;Arial&quot;,sans-serif">Benefits and beneficial insects associated with biodiversity and their impacts in Western cropping systems</span></span></span></span></span></span><br />
      		<strong>&nbsp;</strong></li>
      </ul>

      <p>
      	<span style="font-size:11pt"><span style="line-height:107%"><span style="font-family:Calibri,sans-serif"><span style="font-size:12.0pt"><span style="line-height:107%"><span style="font-family:&quot;Arial&quot;,sans-serif">Featuring: Peter Kenagy of Kenagy Family Farm in the Willamette Valley, Brad Bailie of Lenwood Farm in the Columbia Basin, Rachael Long, University of CA Cooperative Extension, Yolo County, Rex Dufour, CA Office National Center for Appropriate Technology, Gail Redberg of the Tribal Native Nursery of the Confederated Tribes of the Umatilla Indian Reservation and more.</span></span></span></span></span></span>&nbsp;</p>

      <p>
      	Sponsored by Benton, Clackamas, Marion, East and West&nbsp;Multnomah and Tualatin Soil Water and Conservation Districts, National Center for Appropriate Technology and USDA-NIFA Extension Implementation Program.</p>

      <h5 style="text-align: center;">
      	<em><strong>REGISTRATION IS NOW CLOSED! Thank you for your interest!&nbsp;</strong></em></h5>

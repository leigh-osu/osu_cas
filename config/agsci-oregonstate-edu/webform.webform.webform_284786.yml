elements: |-
  intro:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <h3 style="text-align:center">
      	Help us thank our donors!</h3>

      <p style="text-align:center">
      	<strong>Many OSU scholarships are made possible by the generosity of our donors, and it is incredibly meaningful for donors to learn about the students their gifts support.</strong></p>

      <p>
      	<strong>By selecting Yes below, I agree to the following:</strong></p>

      <p>
      	The Family Educational Rights and Privacy Act (FERPA) of 1974 is a federal law designed to protect the privacy of your student records and regulates how information is utilized. Release of student records at Oregon State University is bound by the federal law (FERPA), the Oregon Revised Statutes, and by the Oregon Administrative Rules. In accordance with these laws and rules, it is necessary for Oregon State University to obtain formal consent from the student in order to release protected information to a third party, such as scholarship donors.</p>

      <ol>
      	<li>
      		I authorize Oregon State University to release information about my scholarship award, demographic profile, university activities, and academic program to the Oregon State University Foundation, and to the donors who support this scholarship program, for the purpose of donor and scholarship management.</li>
      	<li>
      		I understand that this authorization will remain valid until I notify Oregon State University’s Scholarship Office in writing that I am revoking this authorization.</li>
      	<li>
      		I understand that if I do not agree to these terms (by clicking “No” below), that I am still able to receive this scholarship, if eligible.</li>
      </ol>

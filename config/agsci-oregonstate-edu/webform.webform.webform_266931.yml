    '#text': |-
      <p>
      	[[{"fid":"486731","view_mode":"default","fields":{"format":"default","alignment":"center","field_file_image_alt_text[und][0][value]":"OSU-EOU Graduation &amp; Alumni BBQ | May 31, 2024 | 5:30-7pm | Badgley Hall","field_file_image_title_text[und][0][value]":"OSU-EOU Graduation &amp; Alumni BBQ | May 31, 2024 | 5:30-7pm | Badgley Hall","external_url":""},"type":"media","field_deltas":{"1":{"format":"default","alignment":"center","field_file_image_alt_text[und][0][value]":"OSU-EOU Graduation &amp; Alumni BBQ | May 31, 2024 | 5:30-7pm | Badgley Hall","field_file_image_title_text[und][0][value]":"OSU-EOU Graduation &amp; Alumni BBQ | May 31, 2024 | 5:30-7pm | Badgley Hall","external_url":""}},"link_text":null,"attributes":{"alt":"OSU-EOU Graduation &amp; Alumni BBQ | May 31, 2024 | 5:30-7pm | Badgley Hall","title":"OSU-EOU Graduation &amp; Alumni BBQ | May 31, 2024 | 5:30-7pm | Badgley Hall","height":1080,"width":1920,"class":"media-element file-default media-wysiwyg-align-center","data-delta":"1"}}]]</p>

      <p>
      	Join us in celebrating Oregon State University in Eastern Oregon. We are bringing together area OSU Alumni, current and past OSU Ag and NR Program students and faculty to recognize the 2024 graduating class, student achievements, and catch-up with others. A BBQ buffet will be served. Hope to see you there!</p>

      <p>
      	This is a free event, hosted by the OSU Ag and NR Program, OSU College of Agricultural Sciences, OSU Alumni Association, and our partner Eastern Oregon University.</p>

      <ul>
      	<li>
      		<strong>Date</strong>: Friday, May 31<sup>st</sup></li>
      	<li>
      		<strong>Time</strong>: 5:30pm – 7pm</li>
      	<li>
      		<strong>Location</strong>: <a href="">Badgley Hall patio</a></li>
      	<li>
      		<strong>Parking</strong>: Badgley Hall @ intersection of 6<sup>th</sup> &amp; K street</li>
      	<li>
      		<strong>Who</strong>: Students, Faculty, and CAS OSU Alumni</li>
      	<li>
      		<strong>Food</strong>: BBQ fare</li>
      	<li>
      		<strong>Questions?</strong>
      		<ul>
      			<li>
      				Email <a href="mailto:Penelope.Diebel@oregonstate.edu">Penny Diebel</a></li>
      			<li style="text-size-adjust: 100%;">
      				541-910-4035 (cell)</li>
      		</ul>
      	</li>
      </ul>

      <p >
      	Welcome and Student Recognition Presentations by:</p>

      <ul>
      	<li>
      		Penny Diebel, Director, OSU Agriculture and Natural Resources Program at EOU</li>
      	<li>
      		Ricardo Mata-Gonzalez, Associate Dean of Academic Programs, College of Agricultural Sciences</li>
      	<li>
      		Ally Rumpkis, Director of Alumni Relations, College of Agricultural Sciences</li>
      </ul>

    '#text': |-
      <p>
      	<strong>Special End of Year Virtual Meet-Up with College of Agricultural Sciences Dean, Staci Simonich</strong></p>

      <p>
      	Congratulations on completing the 2022-2023 academic year! To celebrate this accomplishment, Dean Simonich would like to personally congratulate you during a virtual meet-up on June 16 at 3pm.</p>

      <p>
      	Please register below for this event and receive log-in information. In addition, feel free to submit any questions you would like the Dean to address during this 30 minute chat.</p>

      <p>
      	Once again, congrats and Go Beavs!</p>

elements: |-
  intro:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <div>
      	<p>
      		Oregon State University is excited to invite FFA chapters and high school teachers to apply for our Agrivoltaics Research Kit Program. This program will&nbsp;provide&nbsp;a hands-on opportunity to explore the innovative intersection of agriculture and solar energy. These kits give students the chance to investigate how crops, soil, and solar panels interact, helping them build real-world scientific skills while contributing to emerging agrivoltaics research.</p>

      	<p>
      		Because we have a limited supply of kits, we will distribute them strategically to capture data from a wide range of growing conditions across the United States. This approach ensures that students’ findings collectively reflect the diversity of agricultural environments nationwide.</p>

      	<p>
      		We encourage curious, motivated FFA chapters and high school teachers to apply and take part in shaping the future of sustainable food and energy systems.</p>

      	<p>
      		Please complete the application form by <strong>May 30, 2026</strong>, to be considered in the initial review. Applications will continue to be accepted after this date and will be reviewed on a rolling basis until all kits have been distributed. Kits will be allocated based on geographic diversity and overall project fit, and all applicants from the initial review period will be notified of their status by <strong>June 14, 2026</strong>.</p>
      </div>

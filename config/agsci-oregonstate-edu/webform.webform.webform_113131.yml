elements: |-
  intro:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <div style="padding:25px; background-color: #C4D6A4;">
      	<h3>
      		Ask an Expert</h3>

      	<p>
      		Ask Extension is a way for you to get answers from the Oregon State University Extension Service. We have experts in family and health, community development, food and agriculture, coastal issues, forestry, programs for young people, and gardening.</p>

      	<p>
      		<a class="btn btn-large btn-primary" href="https://extension.oregonstate.edu/ask-expert" target="_blank">Contact Ask an Expert</a></p>
      </div>

      <div style="padding:25px; background-color: #b7a99a;">
      	<h3>
      		Contact Your Local Master Gardener</h3>

      	<p>
      		The Oregon State University Extension Master Gardener program educates Oregonians about the art and science of growing and caring for plants.</p>

      	<p>
      		<a class="btn btn-large btn-primary" href="https://extension.oregonstate.edu/program/all/mg/local-programs" target="_blank">Find Your Local Master Gardener</a></p>
      </div>

      <h3>
      	College of Agricultural Sciences Units</h3>

uuid: 8bd3a029-3f39-4f50-9977-a9e22183e79a
langcode: en
status: true
dependencies: {  }
_core:
  default_config_hash: WTj2oznFkkM7pvsH--Wv6w8SjUvDm97QIw6UPRI_bnQ
id: cas_feature_story_to_story
class: null
idMap: {  }
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - 'Drupal 7'
  - Content
  - 'Layout content'
  - OSU
  - CAS
  - 'CAS content'
migration_group: content
label: 'Feature Story to Story Content Migration'
source:
  plugin: d7_node_domain_access
  node_type: feature_story
  high_water_property:
    name: changed
process:
  title: title
  body:
    plugin: sub_process
    source: body
    process:
      value:
        plugin: osu_media_wysiwyg_filter
        source: value
      summary: summary
      format:
        plugin: default_value
        default_value: full_html
  field_osu_story_caption:
    plugin: get
    source: field_caption
  field_osu_story_cover_image:
    plugin: sub_process
    source: field_picture
    process:
      target_id:
        -
          plugin: migration_lookup
          migration:
            - upgrade_d7_media_images
            - cas_media_private_images
          source: fid
          no_stub: true
        -
          plugin: skip_on_empty
          method: process
  field_osu_story_external_url:
    plugin: sub_process
    source: field_feature_story_alt_url
    process:
      uri: url
      title: title
  field_story_category:
    plugin: default_value
    default_value:
      -
        value: feature_story
  promote:
    plugin: extract
    source: field_feature_story_front
    index:
      - 0
      - value
    default: 0
  field_tax_story_tags:
    plugin: sub_process
    source: field_tags
    process:
      target_id:
        plugin: migration_lookup
        migration: 'upgrade_d7_taxonomy_terms:tags'
        source: tid
  field_meta_tags:
    -
      plugin: d7_metatag_entities
      source: pseudo_metatag_entities
  path/pathauto:
    plugin: default_value
    default_value: 0
  type:
    plugin: default_value
    default_value: story
  field_domain_access:
    -
      plugin: sub_process
      source: domain_access_node
      process:
        target_id: target_id
  field_domain_all_affiliates:
    -
      plugin: get
      source: domain_all_affiliates
  field_domain_source:
    -
      plugin: get
      source: domain_source
  uid: node_uid
  status: status
  created: created
  changed: changed
  sticky: sticky
destination:
  plugin: 'entity:node'
  default_bundle: story
migration_dependencies:
  required:
    - upgrade_d7_files
    - upgrade_d7_users_with_roles
    - 'upgrade_d7_taxonomy_terms:tags'
    - upgrade_d7_media_images

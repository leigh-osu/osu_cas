elements: |-
  intro:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <p>
      	We know that we have amazing students in the College of Agricultural Sciences. In order to capture and share some of your wonderful stories about the many activities, accomplishments, and events that you are engaged with, please fill out the following short form and we’ll be in touch to finalize your story with you to share to our large AgSci community of students, alumni, faculty/staff, employers, stakeholders and more. We love our students and we want to share your story with the world!</p>
  full_name:
    '#type': textfield
    '#unique': false
    '#title': 'Full Name'
    '#required': true
  department:
    '#type': textfield
    '#unique': false
    '#title': Department
  what_do:
    '#type': textarea
    '#title': 'What did you do?'
  why_matter:
    '#type': textarea
    '#title': 'Why did it matter?'
  who_impact:
    '#type': textarea
    '#title': 'Who did it impact?'
  anything_else:
    '#type': textarea
    '#title': 'Is there anything else that you would like to share with us?'
  has_an_article_already_been_published_on_this_story:
    '#type': textfield
    '#unique': false
    '#title': 'Has an article already been published on this story? If so, please provide the URL.'
    '#description': 'Please provide the URL for any other article about this story.'
  photos:
    '#type': managed_file
    '#max_filesize': 2.0
    '#file_extensions': 'gif jpg jpeg png'
    '#title_display': inline
    '#title': Photo
    '#description': 'Upload a photo from your project that we can use in telling your story.'
  photo2:
    '#type': managed_file
    '#max_filesize': 2.0
    '#file_extensions': 'gif jpg jpeg png'
    '#title_display': inline

  statement_of_applicant:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <h3>
      	Statement of Applicant:</h3>

      <p>
      	The Family Educational Rights and Privacy Act (FERPA) of 1974 protects students' privacy and their educational records. The OSU Department of Crop and Soil Science collaborates with the Timothy Scott Wirth Memorial Scholarship selection committee by collecting scholarship applications each year. These applications will then be forwarded to the Timothy Scott Wirth Memorial Scholarship selection committee, who will review the submitted applications and select the scholarship recipient(s).</p>

      <p>
      	I, the undersigned, certify that all of the above information is complete and accurate. I grant my permission to the Department of Crop and Soil Science to release the information from this application to the Timothy Scott Wirth Memorial Scholarship selection committee. I also grant my permission to the Department of Crop and Soil Science to publish my name and brief biography in their associated newsletters, social media sites, and website.</p>

      <p>
      	<br />
      	PLEASE NOTE: Your acceptance of these terms is <em>required</em> for a complete application. Applications without acceptance of these terms will not be considered for this scholarship.</p>

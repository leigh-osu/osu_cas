elements: |-
  intro:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <h3>
      	Application Deadline: April 1</h3>

      <p>
      	The Timothy Scott Wirth Memorial Scholarship was established in 1990 by the Byron and Edna Scott family of Linn County, Oregon in memory of their grandson, Tim Wirth. Tim was enrolled in the Crop Science program at Oregon State University. This scholarship is open to students who anticipate studying at Oregon State University within the College of Agricultural Sciences, and who are:&nbsp;</p>

      <p>
      	•&nbsp;&nbsp; &nbsp;Graduates of Linn County, OR secondary schools<br />
      	•&nbsp;&nbsp; &nbsp;Graduates of Benton County, OR secondary schools<br />
      	•&nbsp;&nbsp; &nbsp;Transfer students from colleges or universities based in Oregon’s Willamette Valley<br />
      	•&nbsp;&nbsp; &nbsp;Continuing undergraduate students in the College of Agricultural Sciences at Oregon State University.</p>

      <p>
      	Scholarship award selection preference will be given to individuals who come from a rural farm background, who have been involved in FFA or 4-H, who will major in Crop and Soil Sciences, and/or who contribute their own financial resources to their college education. If you do not meet these preferences, your application is still highly encouraged.&nbsp;Recipients of the Timothy Scott Wirth Memorial Scholarship will receive their award as a direct-deposit into their OSU Student Account, which will be disbursed during the upcoming academic year.&nbsp;</p>

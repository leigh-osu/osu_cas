  letters_of_reference:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <h3>
      	Letters of Reference:</h3>

      <p>
      	Applicants are requested to solicit <strong>one&nbsp;</strong>letter of reference from <em>any</em> of the following sources:</p>

      <ul>
      	<li>
      		A character reference</li>
      	<li>
      		A high school teacher or counselor</li>
      	<li>
      		A collegiate teacher, counselor, or advisor</li>
      	<li>
      		An employer</li>
      </ul>

      <p>
      	The letter either may be attached to this application below or may be sent by the writer directly to the Crop and Soil Science Department. If your letter of recommendation will be sent by the writer directly to&nbsp;Crop and Soil Science Department please have them send it to Rachel Swindon, rachel.swindon@oregonstate.edu. Please provide the name and contact information of the writer who will be sending their letter&nbsp;of recommendation directly to the&nbsp;Crop and Soil Science Department.</p>

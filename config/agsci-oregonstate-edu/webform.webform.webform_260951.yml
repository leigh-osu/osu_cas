id: webform_260951
title: 'Oregon Seed Association Scholarship, Oregon Seed Cleaning Scholarship and William Kent Wiley Jr. Memorial Scholarship'
description: null
categories: {  }
elements: |-
  intro:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <h3>
      	Application Deadline: November 14, 2025</h3>

      <p>
      	Supporting Oregon State University students interested in the Oregon seed industry is an important endeavor. Within the following scholarship application packet are three separate scholarships, each with their own applicant criteria and expectations. Please review this information in full and reach out to the Crop and Soil Science (CSS) Scholarship Committee Chair&nbsp;Alyssa DuVal (alyssa.duval@oregonstate.edu) with any application questions.</p>

      <h3>
      	Available Scholarships and Associated Criteria:</h3>

      <ul>
      	<li>
      		<h5>
      			Oregon Seed Association Scholarship</h5>

      		<ul>
      			<li>
      				<strong>Criteria:</strong>

      				<ul>
      					<li>
      						Current undergraduate student within the College of Agricultural Sciences at Oregon State University (includes campus and Ecampus students)</li>
      					<li>
      						Financial Need</li>
      					<li>
      						Interest in the seed industry (production, improvement, marketing, etc.)</li>
      				</ul>
      			</li>
      			<li>
      				<strong>Student Tasks:</strong>
      				<ul>
      					<li>
      						Submit a completed application (below)</li>
      					<li>
      						Attach&nbsp;a letter of recommendation from an advisor, supervisor, counselor, instructor, or employer (must be a letter of recommendation written within the past year) to application below.</li>
      					<li>
      						Participate in an interview with Oregon Seed Association representatives (either in-person or via Zoom) in late-November.</li>
      				</ul>
      			</li>
      		</ul>
      	</li>
      	<li>
      		<h5>
      			Oregon Seed Cleaning Scholarship</h5>

      		<ul>
      			<li>
      				<strong>Criteria:</strong>

      				<ul>
      					<li>
      						Current undergraduate student enrolled within the Crop and Soil Science Department at Oregon State University (includes campus and Ecampus students)</li>
      					<li>
      						Oregon resident</li>
      					<li>
      						Current Sophomore or Junior academic standing (including transfer students)</li>
      					<li>
      						Preference for this scholarship is given to candidates with a stated interest in pursuing a career within the Pacific Northwest in a field related to seed production, improvement, or marketing</li>
      				</ul>
      			</li>
      			<li>
      				<strong>Student Tasks:</strong>
      				<ul>
      					<li>
      						Submit a completed application (below)</li>
      					<li>
      						Participate in an interview with Oregon Seed industry representatives (either in-person or via Zoom) in late-November.</li>
      				</ul>
      			</li>
      		</ul>
      	</li>
      	<li>
      		<h5>
      			William Kent Wiley Jr. Memorial Scholarship</h5>

      		<ul>
      			<li>
      				<strong>Criteria:</strong>

      				<ul>
      					<li>
      						Current graduate student majoring in Crop Science at Oregon State University</li>
      					<li>
      						Student research project shall address needs of the grass seed industry</li>
      				</ul>
      			</li>
      			<li>
      				<strong>Student Tasks:</strong>
      				<ul>
      					<li>
      						Submit a completed application (below)</li>
      					<li>
      						Submit a 1-2 page overview of your current research project (attach below)</li>
      					<li>
      						Participate in an interview with Oregon Seed industry representatives (either in-person or via Zoom) in late-November</li>
      				</ul>
      			</li>
      		</ul>
      	</li>
      </ul>

      <h3>
      	Payment of Scholarships:</h3>

      <ul>
      	<li>
      		Recipients of the above scholarships will be selected following interviews conducted in mid-November.
      		<ul>
      			<li>
      				Applicants selected to receive an Oregon Seed Association Scholarship will be invited to attend the Oregon Seed Association annual meeting in January 2026. Oregon Seed Association Scholarship awards will be mailed directly to recipients.</li>
      			<li>
      				Applicants selected to receive an Oregon Seed Cleaning Scholarship will have their award direct-deposited into their OSU Student Accounts to be disbursed during the 2026-2027&nbsp;academic year.</li>
      			<li>
      				Applicants selected to receive a William Kent Wiley Jr. Memorial Scholarship will have their award direct-deposited into their OSU Student Accounts to be disbursed during the 2026-2027&nbsp;academic year.</li>
      		</ul>
      	</li>
      </ul>

      <h3>
      	Additional Information:</h3>

      <p>
      	Application must be completed and submitted by the deadline to be considered.&nbsp;Following the application deadline, all submitted documents will be forwarded to the associated scholarship selection committees.</p>

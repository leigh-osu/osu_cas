    '#format': full_html
    '#text': |-
      <h3>
      	Essay Questions:</h3>
  1_please_tell_us_a_little_about_yourself_and_your_background1:
    '#type': textarea
    '#title': '1. Provide a brief biography of yourself as well as describe your prior work experiences and/or interest with the seed industry (minimum of 150 words).'
    '#description': '*Note: Minimum of 150 words'
    '#required': true
  2_briefly_describe_your_academic_and_professional_goals_and_interests:
    '#type': textarea
    '#title': '2. Describe your current overall financial need status (i.e. how will a scholarship assist you in completing your educational goals, etc.).'
    '#required': true
  3_please_discuss_an_event_that_you_have_experiences_within_the_past_five_years:
    '#type': textarea
    '#title': '3. Identify one course that you have completed while pursuing studies at Oregon State University and explain how you will use the information gained toward your future occupation.'
    '#required': true
  4_describe_future_plans:
    '#type': textarea
    '#title': '4. Describe your future plans toward an agricultural vocation and if/how you will be involved within the seed industry.'
    '#required': true
  statement_of_applicant:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <h3>
      	Statement of Applicant:</h3>

      <p>
      	The Family Educational Rights and Privacy Act (FERPA) of 1974 protects students' privacy and their educational records. The OSU Department of Crop and Soil Science collaborates with the Oregon Seed Association Scholarship&nbsp;selection committee by collecting scholarship applications each year. These applications will then be forwarded to the Oregon Seed Association Scholarship selection committee, who will review the submitted applications and select the scholarship recipient(s).</p>

      <p>
      	I, the undersigned, certify that all of the above information is complete and accurate. I grant my permission to the Department of Crop and Soil Science to release the information from this application to the Oregon Seed Association Scholarship selection committee. I also grant my permission to the Department of Crop and Soil Science to publish my name and brief biography in their associated newsletters, social media sites, and website.</p>

      <p>
      	<br />
      	PLEASE NOTE: Your acceptance of these terms is <em>required</em> for a complete application. Applications without acceptance of these terms will not be considered for this scholarship.</p>

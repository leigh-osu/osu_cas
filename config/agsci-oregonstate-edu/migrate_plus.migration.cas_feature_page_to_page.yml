process:
  title: title
  body:
    plugin: sub_process
    source: field_introduction
    process:
      value:
        plugin: osu_media_wysiwyg_filter
        source: value
      format:
        plugin: default_value
        default_value: full_html
  field_tax_cas_section:
    plugin: sub_process
    source: field_cas_section
    process:
      target_id:
        plugin: migration_lookup
        migration: 'upgrade_d7_taxonomy_terms:type'
        source: tid
  field_osu_meta_image:
    plugin: sub_process
    source: field_cover_photo
    process:
      target_id:
        -
          plugin: migration_lookup
          migration:
            - upgrade_d7_media_images
            - cas_media_private_images
          source: fid
          no_stub: true
        -
          plugin: skip_on_empty
          method: process
  field_meta_tags:
    -
      plugin: d7_metatag_entities
      source: pseudo_metatag_entities
  path/pathauto:
    plugin: default_value
    default_value: 0
  cover_temp:
    plugin: cas_cover_photo_section
    source: field_cover_photo
  default_temp:
    plugin: default_layout
    bundle: page
  paragraphs_temp:
    plugin: cas_paragraphs_layout
    source_field: field_paragraph
  layout_builder__layout:
    plugin: get
    source:
      - '@cover_temp'
      - '@default_temp'
      - '@paragraphs_temp'
  type:
    plugin: default_value
    default_value: page
  field_domain_access:
    -
      plugin: sub_process
      source: domain_access_node
      process:
        target_id: target_id
  field_domain_all_affiliates:
    -
      plugin: get
      source: domain_all_affiliates
  field_domain_source:
    -
      plugin: get
      source: domain_source

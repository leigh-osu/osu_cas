elements: |-
  intro:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <p>
      	This Veterans Day, the College of Agricultural Sciences wants to recognize and honor the many veterans who work and study here.&nbsp;&nbsp;If you are a veteran, please consider participating so that we can shine a light on the many walks of life our military community comes from in service to this nation and our college.</p>

      <p>
      	Thank you for considering. And thank you for your service.</p>

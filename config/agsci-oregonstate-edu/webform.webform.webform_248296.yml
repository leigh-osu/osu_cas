      <h4 style="text-align: center;">
      	<br />
      	Friday, October 10, 2025<br />
      	2:00pm-3:30pm</h4>

      <p style="text-align: center;">
      	OSU Foundation, Main Board Room<br />
      	4238 SW Research Way<br />
      	Corvallis, OR 97333</p>

      <p style="text-align: center;">
      	<strong><em>Registration closes on September 26, 2025</em></strong></p>

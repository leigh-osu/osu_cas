    '#text': |-
      <p>
      	As the College of Agricultural Sciences advances its strategic plan for inclusive excellence, we recognize that there are many existing efforts that units are leading to impact our goals around Culture, Equity, Diversity, and Inclusion (CEDI).</p>

      <p>
      	In order to recognize these efforts and more importantly, learn from them, please provide a brief summary below so that someone from the CAS Marketing and Communications team can connect with you to help share this work more broadly.</p>

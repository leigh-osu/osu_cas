elements: |-
  instructions:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <p>
      	We would like to showcase the outstanding students, faculty, alumni and industry partners who make up the College of Agricultural Sciences. It is an opportunity for us to celebrate the diversity of the remarkable community of agricultural sciences in Oregon.&nbsp;</p>

      <p>
      	We want to hear about the great work you are doing and your motivation for doing it. This is also a chance for you to inspire others to pursue their passions and achieve their goals.</p>

      <p>
      	&nbsp;</p>

      <h3>
      	The Process</h3>

      <p>
      	1) Fill out the questionnaire below the best you can. *Don't feel obligated to answer every single question. Just the ones that compel you.</p>

      <p>
      	2) Download the model release form, sign it and upload it below. (It allows us to publish your story on the web and social media).</p>

      <p>
      	3) Upload your best pictures. The best pictures for web publishing are horizontally-framed and show your face clearly—but more importantly, they give a sense of context and setting and show your personality! *Please make sure each picture is at least 1MB in size!*</p>

      <p>
      	&nbsp;</p>

      <p>
      	<a class="btn btn-primary" href="/sites/agscid7/files/osu-model-release-2017-shortform.pdf">Model release form</a></p>

    '#text': |-
      <p>
      	[[{"fid":"537261","view_mode":"default","fields":{"format":"default","alignment":"center","field_file_image_alt_text[und][0][value]":"State of the College","field_file_image_title_text[und][0][value]":false,"external_url":""},"type":"media","field_deltas":{"2":{"format":"default","alignment":"center","field_file_image_alt_text[und][0][value]":"State of the College","field_file_image_title_text[und][0][value]":false,"external_url":""}},"link_text":null,"attributes":{"alt":"State of the College","height":810,"width":1933,"class":"media-element file-default media-wysiwyg-align-center","data-delta":"2"}}]]</p>

      <p>
      	&nbsp;<br />
      	You are invited to join your College of Agricultural Sciences community for our State of the College event on October 8, 2025 at 3pm.</p>

      <p style="margin-left:40px">
      	State of the College<br />
      	Alumni Center Ballroom<br />
      	<strong>Wednesday, October 8, 2025</strong><br />
      	<strong>3pm - 4pm:</strong> Dean’s presentation, panel session, conversation with Provost<br />
      	<strong>4pm - 5pm:</strong> Reception with food and beverages</p>

      <p>
      	This event is open to all staff, faculty and students who call the College of Agricultural Sciences home. This is an opportunity to hear directly from College leadership about priorities and goals as they align with our core strengths and values as well as the University’s strategic plan. You will also have the opportunity to submit specific questions in advance that you would like our panel of Associate Deans to address.&nbsp;</p>

      <p>
      	The panel will be moderated by Dean Staci Simonich following her presentation and will include:</p>

      <p style="margin-left: 40px;">
      	Shawn Donkin: Associate Dean, Research<br />
      	Nadia Singh – Associate Dean, Inclusive Excellence &amp; Faculty Affairs<br />
      	Sam Angima: Associate Dean, Extension<br />
      	Jia Hu: Associate Dean, Academic Programs<br />
      	Dave Stone: Associate Dean, International Programs</p>

      <p>
      	Following the panel, <strong>Provost Roy Haggerty</strong> will join Dean Staci Simonich in a conversation about OSU’s Strategic Plan and the role of CAS within it.</p>

      <p>
      	Registration is required for both remote and in-person attendees. Please register and submit any questions you would like addressed below.&nbsp;</p>

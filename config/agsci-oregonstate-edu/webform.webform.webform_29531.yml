      interests_water: 'water quality'
      interests_vegetation: vegetation
      interests_macroinvertebrates: 'benthic macroinvertebrates'
      interests_fish: fish
      interests_hyporheic: 'hyporheic flow'
      interests_grassland: 'grassland meadows'
      interests_restoration: restoration
      interests_soils: soils

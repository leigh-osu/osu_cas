    '#text': |-
      <p><strong>Location:</strong>&nbsp;&nbsp;Chemeketa Eola Northwest Wine Studies Center - 215 Doaks Ferry Road NW Salem, OR 97304</p>
      <p><strong>Time:</strong>&nbsp; 9:00 am – 4:00 pm</p>
      <p><strong>Date:</strong>&nbsp;April 25, 2016</p>
      <p><strong>Registration deadline</strong>: Register here by&nbsp;<span class="s1">March 31, 2016 at 4PM –There is no fee for this event; however, online registration must be completed for each individual who will be attending.</span></p>
      <p><strong>Schedule</strong></p>
      <table border="0">
      <tbody>
      <tr>
      <td>8:30 -9:00 am&nbsp;</td>
      <td>
      <p class="p1"><span class="s1">&nbsp;Registration and refreshments</span></p>
      </td>
      </tr>
      <tr>
      <td>9:00 – 9:15 am&nbsp;</td>
      <td>
      <p class="p1">&nbsp;Welcome and Introductions –&nbsp;<em>Patty Skinkis</em></p>
      </td>
      </tr>
      <tr>
      <td>
      <p class="p1"><span class="s1">9:15 – 10:30 am</span></p>
      </td>
      <td>
      <p class="p1">&nbsp;<span class="s1">Wine production and data collection – <em>James Osborne</em></span></p>
      </td>
      </tr>
      <tr>
      <td>
      <p class="p1"><span class="s1">10:30 – 10:45 am</span></p>
      </td>
      <td>
      <p class="p1">&nbsp;<span class="s1">Break</span></p>
      </td>
      </tr>
      <tr>
      <td>
      <p class="p1"><span class="s1">10:45 – 11:15&nbsp; am</span></p>
      </td>
      <td>
      <p class="p1">&nbsp;<span class="s1">Sensory evaluation methods – <em>Elizabeth Tomasino</em></span></p>
      </td>
      </tr>
      <tr>
      <td>
      <p class="p1"><span class="s1">11:15 – 12:00 pm</span></p>
      </td>
      <td>
      <p class="p1">&nbsp;<span class="s1">Wine results:&nbsp; Composition of vintage 2012 and sensory of vintage 2013 – <em>Elizabeth Tomasino</em></span></p>
      </td>
      </tr>
      <tr>
      <td>
      <p class="p1"><span class="s1">12:00 – 12:45 &nbsp;pm</span></p>
      </td>
      <td>
      <p class="p1">&nbsp;Lunch</p>
      </td>
      </tr>
      <tr>
      <td>
      <p class="p1"><span class="s1">12:45 – 1:45 pm</span></p>
      </td>
      <td>
      <p class="p1">&nbsp;<span class="s1">In-house sensory: How to capture what you taste – <em>Elizabeth Tomasino and Patty Skinkis</em></span></p>
      </td>
      </tr>
      <tr>
      <td>
      <p class="p1"><span class="s1">1:45 – 2:00 pm&nbsp;</span></p>
      </td>
      <td>
      <p class="p1">&nbsp;Break</p>
      </td>
      </tr>
      <tr>
      <td>
      <p class="p1"><span class="s1">2:00 –&nbsp;3:00 pm&nbsp;</span></p>
      </td>
      <td>
      <p class="p1">&nbsp;<span class="s1">2015 Vineyard results and 4-year summary – <em>Patty Skinkis</em></span></p>
      </td>
      </tr>
      <tr>
      <td>
      <p class="p1"><span class="s1">3:00 –&nbsp;3:45 pm &nbsp; &nbsp;&nbsp;</span></p>
      </td>
      <td>
      <p class="p1">&nbsp;<span class="s1">Developing an evaluation road map - <em>All</em></span></p>
      </td>
      </tr>
      <tr>
      <td>
      <p class="p1"><span class="s1">3:45 – 4:00 pm</span></p>
      </td>
      <td>
      <p class="p1">&nbsp;Closing comments</p>
      </td>

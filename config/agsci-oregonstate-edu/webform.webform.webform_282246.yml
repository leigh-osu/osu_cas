elements: |-
  introduction:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <p>
      	&nbsp;<br />
      	You are invited to join your College of Agricultural Sciences community for our President &amp; Provost Engagement event on February 5, 2026 at 11am.</p>

      <p style="margin-left:40px">
      	<span data-teams="true">CH2M Hill Alumni Center</span><br />
      	<strong>Thursday, February 5, 2026</strong><br />
      	<strong>11:00am - 11:45am:</strong> Town hall style visit with the OSU President &amp; Provost.<br />
      	<strong>11:45am - 12:00pm:</strong> Reception with Beaver Classic ice cream</p>

      <p>
      	This event is open to all staff, faculty and students who call the College of Agricultural Sciences home. This is an opportunity to hear directly from OSU leadership about priorities and goals as they align with our core strengths and values as well as the University’s strategic plan. You will also have the opportunity to submit specific questions in advance that you would like to have addressed.&nbsp;</p>

      <p>
      	Registration is required for both remote and in-person attendees. Please register and submit any questions you would like addressed by January 30.&nbsp;</p>

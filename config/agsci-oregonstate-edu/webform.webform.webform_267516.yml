  intro:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <p>
      	[[{"fid":"493991","view_mode":"default","fields":{"format":"default","alignment":"center","field_file_image_alt_text[und][0][value]":"Drawing of the FIC Building","field_file_image_title_text[und][0][value]":"Drawing of the FIC Building","external_url":""},"type":"media","field_deltas":{"1":{"format":"default","alignment":"center","field_file_image_alt_text[und][0][value]":"Drawing of the FIC Building","field_file_image_title_text[und][0][value]":"Drawing of the FIC Building","external_url":""}},"link_text":null,"attributes":{"alt":"Drawing of the FIC Building","title":"Drawing of the FIC Building","height":398,"width":740,"class":"media-element file-default media-wysiwyg-align-center","data-delta":"1"}}]]</p>

      <p>
      	Please join us as we celebrate 25 years of OSU’s Food Innovation Center support of the food and beverage industry on Wednesday, July 24, 2024. We’re very proud to be part of a passionate community that has made this milestone possible – partners in Portland and around the state, entrepreneurs and food and beverage makers, network supporters, non-profit organizations, and many, many more. Our shared love of Oregon and the role of food in our lives has made everything the FIC has accomplished possible and we look forward to celebrating this milestone with you.</p>

      <p>
      	It will be a fun evening including a tour of the FIC, food trucks, delicious beverages, vendors, music and much more. We look forward to seeing you there!</p>

      <p>
      	<strong>Date:</strong> Wednesday, July 24, 2024<br />
      	<br />
      	<strong>Time:</strong> 4:00 – 7:00 pm</p>

      <p>
      	<strong>Location:</strong></p>

      <p style="margin-left: 40px;">
      	OSU Food Innovation Center<br />
      	1207 NW Naito Pkwy<br />
      	Portland, OR 97209</p>

      <p>
      	<strong>Program:</strong></p>

      <ul>
      	<li>
      		4:00 – 4:30 gathering</li>
      	<li>
      		4:30 – 5:30 guided tours</li>
      	<li>
      		5:30 – 6:00 welcoming remarks</li>
      	<li>
      		6:00 – 7:00 eat, drink, visit vendors and socialize!</li>
      </ul>

      <p>
      	<strong>RSVP Deadline:&nbsp;</strong>July 20, 2024</p>

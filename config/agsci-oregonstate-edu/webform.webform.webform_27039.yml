    '#format': full_html
    '#text': |-
      <h3>
      	<strong>Dr. Eric A. Andreasen Graduate Student Travel Award for Excellence in Research and Scholarship</strong></h3>

      <p>
      	The Dr. Eric A. Andreasen Graduate Student Travel Award for Excellence in Research and Scholarship will recognize an outstanding graduate student that best embodies the scientific excellence and leadership exhibited by Dr. Andreasen.</p>

      <p>
      	The recipient will receive an engraved plaque and a $500 cash award.</p>

      <p>
      	Selection criteria include academic background, scientific merit, the potential for research impact, and evidence of leadership and mentoring activities.</p>

      <p>
      	Applicants must be enrolled either at Oregon State University or University of Wisconsin-Madison at time of the award.</p>

      <p>
      	<strong>Use the on-line <a href="https://www.judgify.me/eric.andreasen.award.2020" target="_blank">link</a>&nbsp;below to complete the application packet, which includes:</strong></p>

      <ol>
      	<li>
      		Accepted scientific meeting abstract</li>
      	<li>
      		Current student CV</li>
      	<li>
      		Paragraph, written by applicant, describing mentorship and leadership activities and career goals</li>
      </ol>

      <p>
      	<strong>Applications will be accepted between December 15th and February 1st.</strong></p>

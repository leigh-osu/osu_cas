      body: |-
        Thank you for your submission,

        You will be receiving an email shortly confirming submission of your samples for analysis. If you have any questions, please contact Cole Cerrato at cole.cerrato@oregonstate.edu.

        All samples should be shipped or dropped off at:

        3051 SW Campus Way
        100 Wiegand Hall
        Corvallis, OR 97331

        For wine submission:

            1. Provide at least 50 mL of each wine sample requiring analysis (50 mL is enough for duplicate free- and bound-phenol analysis)
            2. Clearly label all samples for your own reference later. The data will be given a labelled key based on the labels provided
            3. Ensure all containers are properly sealed
            4. If sending by carrier, ship 1 to 3 days delivery, following all guidelines carrier guidelines
            5. Deliveries performed winemaker, should be done by appointment with Cole Cerrato Monday-Friday

        For grape submission:

            1. Provide at 5-6 clusters of grapes
            2. Clearly label all samples for your own reference later. The data will be given a labelled key based on the labels provided
            3. Ensure all containers are properly sealed
            4. If sending by carrier, ship 1 day or overnight to avoid spoilage that could impact results
            5. Deliveries performed by grape grower, should be done by appointment with Cole Cerrato Monday-Friday
            6. Please contact us, if you’re interested in testing nano-ferments

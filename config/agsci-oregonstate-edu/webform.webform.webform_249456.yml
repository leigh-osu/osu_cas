  confirmation_url: ''
  confirmation_message: "<p style=\"text-align: center;\">\r\n\t<strong>Thank you for your submission</strong></p>\r\n\r\n<p>\r\n\tYou will be receiving an email shortly confirming submission of your samples for analysis. If you have any questions, please contact Cole Cerrato at <a href=\"mailto:cole.cerrato@oregonstate.edu\">cole.cerrato@oregonstate.edu</a>.</p>\r\n\r\n<p>\r\n\tAll samples should be shipped or dropped off at:</p>\r\n\r\n<p>\r\n\t3051 SW Campus Way<br />\r\n\t100 Wiegand Hall<br />\r\n\tCorvallis, OR 97331</p>\r\n\r\n<p>\r\n\t<strong>For wine submission:</strong></p>\r\n\r\n<ol>\r\n\t<li>\r\n\t\tProvide at least 50 mL of each wine sample requiring analysis (50 mL is enough for duplicate free- and bound-phenol analysis)</li>\r\n\t<li>\r\n\t\tClearly label all samples for your own reference later. The data will be given a labelled key based on the labels provided</li>\r\n\t<li>\r\n\t\tEnsure all containers are properly sealed</li>\r\n\t<li>\r\n\t\tIf sending by carrier, ship 1 to 3 days delivery, following all guidelines carrier guidelines</li>\r\n\t<li>\r\n\t\tDeliveries performed winemaker, should be done by appointment with Cole Cerrato Monday-Friday</li>\r\n</ol>\r\n\r\n<p>\r\n\t<strong>For grape submission:</strong></p>\r\n\r\n<ol>\r\n\t<li>\r\n\t\tProvide at 5-6 clusters of grapes</li>\r\n\t<li>\r\n\t\tClearly label all samples for your own reference later. The data will be given a labelled key based on the labels provided</li>\r\n\t<li>\r\n\t\tEnsure all containers are properly sealed</li>\r\n\t<li>\r\n\t\tIf sending by carrier, ship 1 day or overnight to avoid spoilage that could impact results</li>\r\n\t<li>\r\n\t\tDeliveries performed by grape grower, should be done by appointment with Cole Cerrato Monday-Friday</li>\r\n\t<li>\r\n\t\tPlease contact us, if you’re interested in testing nano-ferments</li>\r\n</ol>\r\n"

title: '2022 State IPM Coordinating Committee Report'
description: null
categories: {  }
elements: |-
  description:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <p>
      	The 2022 Report of the <a href="https://agsci.oregonstate.edu/oipmc/oregon-state-agency-ipm-committee">State IPM Coordinating Committee</a> is now released.</p>

      <h3>
      	<a class="btn btn-primary" href="/sites/agscid7/files/ippc/state_ipm_coordinating_committee_biennial_report_2021-2022_draft_for_comment.pdf">Click here for 2022 State IPM Report</a></h3>

      <p>
      	&nbsp;</p>

      <p>
      	The State IPM Report is intended to describe the status of Oregon’s state agency IPM programs, including the committee meetings held, and the IPM status of each state agency involved that uses state-owned or leased property. This includes advances, innovations, and training activities in IPM, as well as key challenge areas and recommendations for program improvements. Discussion and final comments on the report will be an agenda item at the next State IPM Committee Meeting in Spring 2023.&nbsp;</p>

      <p>
      	&nbsp;</p>

      <p>
      	<em>For more information, please contact Chris Hedstrom, <a href="mailto: chris.hedstrom@oregonstate.edu">chris.hedstrom@oregonstate.edu</a></em></p>

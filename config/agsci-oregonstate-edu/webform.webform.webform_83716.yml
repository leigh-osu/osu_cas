elements: |-
  introduction:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <p>
      	<strong>BEE SCHOOL</strong><br />
      	As part of our efforts to build taxonomic expertise in surveying Oregon's native bee population, the Oregon Bee Project is offering an advanced five-day native bee survey and identification course at Oregon State University in Corvallis this summer (2018). This course is not required for you to participate in the Atlas. Our goal is to train people in basic taxonomy who can then be leaders in their region by teaching others. Prior experience is not needed - we are looking for people committed for the long term who have a passion for teaching others and sharing the knowledge they have gained from the course.&nbsp;<strong>Instructor:</strong>&nbsp;Lincoln Best</p>

      <p>
      	<strong>Dates: SESSON ONE:&nbsp;Monday, July 9th through Friday, July 13th<br />
      	Dates: SESSON TWO: Monday, July 16th through Friday, July 20th<br />
      	Time: All day sessions, tentatively 9 am to 5 pm<br />
      	Location:</strong> Oregon State University, Corvallis Oregon; classes will be in Cordley Hall, Lab Room 3058<br />
      	<strong>Bee School Cost: </strong>Please enter the amount that was sent to you in the email from Jen Holt. If you need assistance with this, please email <a href="mailto:jen.holt@oregonstate.edu">jen.holt@oregonstate.edu</a><br />
      	<strong>Dorm Room Lodging Cost:</strong>&nbsp; $37.50 per night in a double room in West Hall ($29 room fee plus $8.50 linen service). Check-in is on arrival. A phone number will provided for building access and someone will meet you to give you the building key and meal card (if purchased). Guests may check in a day early (July 8th or July 15th) and stay a night later (July 13th or July 21st), but due to another large event on campus, the lodging will be in a different dorm (the International dorm). Please email your preferred roommate to:&nbsp;<a href="mailto:jen.holt@oregonstate.edu.">jen.holt@oregonstate.edu</a>.<br />
      	<strong>Meal Card Costs:</strong> $16.50 per day (All-you-care-to-eat flat fee includes breakfast and lunch options at Marketplace West Dining Facility next door to the dorm).</p>

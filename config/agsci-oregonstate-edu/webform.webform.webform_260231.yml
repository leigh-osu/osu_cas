      body: |-
        [webform_submission:values:first_name] [webform_submission:values:last_name],

        Thank you for registering to attend ER Jackman Fellows Recognition Luncheon on October 10 at noon in the OSU Foundation, Main Board Room. If something comes up and you’re not able to attend the event, please email Ally.Miklasz@osualum.com so she may remove you from our expected attendees list and adjust the headcount for lunch.

        I look forward to seeing you at our luncheon so that I can have the opportunity to meet you, learn more about your connections to our college, answer questions about our work, celebrate our shared history, and personally thank you. Our lunch will be just prior to the annual meeting of the ER Jackman Friends and Alumni group. As a lifetime Fellow, you are also invited to join us for our annual meeting this year and in years going forward where I will be sharing updates about our college and our future plans.

        Go Beavs! 

        Staci L. Simonich, Ph.D., M.B.A.
        Dean and Reub Long Professor
        College of Agricultural Sciences
        Director of the Oregon Agricultural Experiment Station

    '#title_display': inline
    '#title': 'Email address'
    '#required': true
  i_am_osu_alumni:
    '#type': radios
    '#options':
      alumni_yes: 'Yes'
      alumni_no: 'No'
    '#title_display': inline
    '#title': 'I am an OSU Alumni'
    '#required': true
  if_yes_what_major_grad_year:
    '#type': textfield
    '#title': 'If yes, what major / grad year'
    '#states':
      visible:
        - ':input[name="i_am_osu_alumni"]':
            value: alumni_yes
  i_plan_to_bring_a_guest:
    '#type': radios
    '#options':
      guest_yes: 'Yes'
      guest_no: 'No'
    '#title_display': inline
    '#title': 'I plan to bring a guest'
    '#required': true
  guest_name:
    '#type': textfield
    '#unique': false
    '#title_display': inline
    '#title': 'Guest name'
    '#states':
      visible:
        - ':input[name="i_plan_to_bring_a_guest"]':
            value: guest_yes
  do_you_have_any_food_sensitivities:
    '#type': checkboxes
    '#options':
      food_gluten: 'Gluten Free'
      food_dairy: 'Dairy Free'
      food_nuts: 'Nut Free'
      food_vegetarian: Vegetarian
      food_kosher: Kosher
      food_other: Other
    '#multiple': true
    '#title': 'Do you have any food preferences?'
  other_food_preferences:
    '#type': textarea
    '#title': 'Other food preferences'
    '#states':
      visible:
        - ':input[name="do_you_have_any_food_sensitivities[food_other]"]':
            checked: true
  additional_feedback:
    '#type': textarea
    '#title': 'Additional feedback'
  contact_info:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <p>
      	<strong>Questions?</strong> Contact Ally Miklasz, Director of Alumni Relations, College of Agricultural Sciences, at <a href="mailto:ally.miklasz@osualum.com" style="color:#467886; text-decoration:underline">ally.miklasz@osualum.com</a>&nbsp;or 541-556-9516</p>

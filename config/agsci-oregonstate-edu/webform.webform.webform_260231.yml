    '#text': |-
      <p style="text-align: center;">
      	[[{"fid":"501806","view_mode":"default","fields":{"format":"default","alignment":"center","field_file_image_alt_text[und][0][value]":"E.R. Jackman Friends &amp; Alumni Fellows Luncheon","field_file_image_title_text[und][0][value]":"E.R. Jackman Friends &amp; Alumni Fellows Luncheon","external_url":""},"type":"media","field_deltas":{"1":{"format":"default","alignment":"center","field_file_image_alt_text[und][0][value]":"E.R. Jackman Friends &amp; Alumni Fellows Luncheon","field_file_image_title_text[und][0][value]":"E.R. Jackman Friends &amp; Alumni Fellows Luncheon","external_url":""}},"link_text":null,"attributes":{"alt":"E.R. Jackman Friends &amp; Alumni Fellows Luncheon","title":"E.R. Jackman Friends &amp; Alumni Fellows Luncheon","height":252,"width":869,"class":"media-element file-default media-wysiwyg-align-center","data-delta":"1"}}]]</p>

      <h4 style="text-align: center;">
      	<br />
      	Friday, October 10, 2025<br />
      	12:00 pm -1:30 pm</h4>

      <p style="text-align: center;">
      	OSU Foundation, Main Board Room<br />
      	4238 SW Research Way<br />
      	Corvallis, OR 97333</p>

      <p style="text-align: center;">
      	<strong><em>Registration closes on October 1, 2025</em></strong><span style="color: rgb(51, 51, 51); font-family: &quot;Open sans&quot;, sans-serif; font-size: 16px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 300; letter-spacing: normal; orphans: 2; text-align: start; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; white-space: normal; background-color: rgb(255, 255, 255); text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial; display: inline !important; float: none;"></span></p>

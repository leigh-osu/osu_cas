elements: |-
  intro:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <p style="margin-left:48px">
      	<em>Hi, there! Thank you for your interest in the OSU College of Agricultural Sciences Arizona Friends &amp; Alumni Event. We are moving our event to combine efforts with the OSU Alumni Association meetup Friday, February 17<sup>th</sup> at State 48 Brewery from 4-6pm. We hope you’ll join us! Register at the link below, and please contact Ally Rumpakis, Director of Alumni Relations for the College of Agricultural Sciences, with any questions at <a href="mailto:ally.rumpakis@osualum.com" style="color:#0563c1; text-decoration:underline">ally.rumpakis@osualum.com</a> or 541-556-9516. </em></p>

      <p style="margin-left:48px">
      	&nbsp;</p>

      <p style="margin-left:48px">
      	<em><a href="https://beaver-baseball-in-the-desert-surprise-az.eventfarm.com/app/pages/f9d9c06b-362e-451c-a94d-42e2dda1d1ac">Beaver Baseball in the Desert - Surprise, AZ (eventfarm.com)</a><br />
      	*Click the orange “Register” button to RSVP for the Friday event</em></p>

      <p style="margin-left:48px">
      	&nbsp;</p>

      <p style="margin-left:48px">
      	<em>Thanks, and Go Beavs!</em></p>

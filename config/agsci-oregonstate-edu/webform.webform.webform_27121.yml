    '#type': processed_text
    '#format': full_html
    '#text': |-
      <p class="p1">Do you love new plants and like hearing about breeding new ones? &nbsp;Come out to the Ornamental Plant Breeding Field day! &nbsp;It will not be a lecture series; you will get to walk our plots, get to see a lot of plants, and provide valuable input on the direction of our program. &nbsp;</p>
      <p class="p1">When: &nbsp;June 15, 2017</p>
      <p class="p1">Time: 1 - 5pm</p>
      <p class="p1">Place: &nbsp;Lewis-Brown Horticulture Research Farm;&nbsp;33329 Peoria Rd,&nbsp;Corvallis, OR 97333</p>
      <p class="p3">Specific place: When you enter the farm, turn left at the first intersection and you will see the poly houses and container pad.</p>
      <p>&nbsp;</p>

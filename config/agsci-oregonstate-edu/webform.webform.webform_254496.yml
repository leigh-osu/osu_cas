  will_discount_codes_be_used_for_some_products_if_so_please_explain:
    '#type': textarea
    '#title': 'Will discount codes be used for some products? If so, please explain'
    '#description': 'ie. do students pay a different price than the general public? Is there a short term promotional price for a product?'
  shipping_cost:
    '#type': textarea
    '#title': 'What is the shipping cost associated with your product(s)? Are there special shipping instructions that we need to include?'
  what_is_your_refund_policy:
    '#type': textarea
    '#title': 'What is your refund policy?'
  email_address:
    '#type': textfield
    '#unique': false
    '#title_display': inline
    '#title': 'What email address should be used as the contact for store?'
  introductory_overview_informaton:
    '#type': textarea
    '#title': 'Introductory/overview information you would like on the homepage of the uStore'
  what_you_want_to_be_in_the_order_confirmation_email_message:
    '#type': textarea
    '#title': 'What you want to be in the order confirmation email message?'
  is_there_anythig_else_we_should_know_about_your_store:
    '#type': textarea
    '#title': 'Is there anything else we should know about your store?'
    '#description': 'Is there anything unique about your store that we should plan for when building it?'

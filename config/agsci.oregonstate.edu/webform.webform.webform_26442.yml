elements: |-
  intro:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <h3>
      	Follow these steps:</h3>

      <p>
      	<strong>Step 1. If you meet these criteria, go ahead and apply!&nbsp;</strong></p>

      <ul>
      	<li>
      		Undergraduate in the College of Agricultural Sciences or College of Forestry</li>
      	<li>
      		Sophomore standing by the time you would enroll in the Academy</li>
      	<li>
      		Academic standing is good (not on academic warning or suspension)</li>
      	<li>
      		At least one year remaining at OSU Corvallis Campus. At this time, the Leadership Academy is not available for Ecampus students.</li>
      	<li>
      		You can register for one credit of LEAD 407 and meet with us on Wednesdays from 4:00-5:50pm for seminar</li>
      </ul>

      <p>
      	&nbsp;</p>

      <p>
      	<strong>Step 2. Fill out the form below and attach your resume. </strong></p>

      <p>
      	Don't worry if you feel like your resume is incomplete or that you don't have much on it; we aren't looking for anything specific, we just want to get to know you! We don't require a minimum GPA to join the Academy, but we do want to make sure you have time for this commitment. As long as your academic standing is good (i.e., not on academic warning, suspension, etc.) then you're good to go!</p>

      <p>
      	&nbsp;</p>

      <p>
      	<strong>Step 3. We'll call you!</strong></p>

      <p>
      	We will reach out to you letting you know if you've been selected to move to the group interview. You'll be notified in early June if you've been accepted.</p>

  introduction:
    '#type': processed_text
    '#format': full_html
    '#text': '<p>The BPP field is asking farm users to provide information concerning management of their plots. Please fill out the following request noting the specific plot, desired services, and approximate timeline for plot activities. For services such as irrigation (or fertilizers), please indicate whether you want the farm crew to maximize plant growth (frequent irrigation), or to maintain the plants in a healthy but non- vigorous condition. Please do this for each plot or space you have on the Botany &amp; Plant pathology Field Lab.</p>'

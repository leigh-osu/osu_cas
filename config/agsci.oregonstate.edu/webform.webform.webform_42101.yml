id: webform_42101
title: 'Digital Signage in Strand Agriculture Hall'
description: null
categories: {  }
elements: |-
  intro:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <p>
      	The CAS Web Team manages two digital screens in Strand Agriculture Hall on the first floor. If you'd like to post content on these displays, please submit the form below. All submissions are subject to approval by the CAS Web Team.</p>

      <h3>
      	General Advertising Guidelines</h3>

      <ul>
      	<li>
      		<span>Digital signage must be submitted by, and in promotion of events or programs affiliated with OSU departments and CAS affliated programs.&nbsp;</span></li>
      	<li>
      		<span><span>For events,the signage must have a notice for disability accomodations. For example:&nbsp;</span></span>
      		<ol>
      			<li>
      				<span>&nbsp;</span><span><em>For alternative formats or accommodations related to a disability, please contact (sponsoring department/organization contact name) at (phone or email)</em>; or</span></li>
      			<li>
      				<span>&nbsp;</span><span><em>Accommodation requests related to disability should be made by [specific date] to [sponsoring department/organization contact person, phone number, and email address].</em></span></li>
      		</ol>
      	</li>
      </ul>

      <h3>
      	Signage Guidelines</h3>

      <ul>
      	<li>
      		All slides need to be sized at 1920 x 1080px and saved as a jpg.</li>
      	<li>
      		Please make sure that all your text is legible. (We’ve had a few instances lately where that text was either so small or such a light color that it wasn’t readable on screen).</li>
      	<li>
      		Contact <a href="mailto:caswebrequest@oregonstate.edu">caswebrequest@oregonstate.edu</a> if you have any questions.</li>
      </ul>

      <p>
      	&nbsp;</p>

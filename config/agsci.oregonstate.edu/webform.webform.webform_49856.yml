  fieldset_students_learning_objectives:
    '#type': fieldset
    '#open': true
    '#title': "Student's Learning Objectives "
    instruction_31:
      '#type': processed_text
      '#format': full_html
      '#text': '<p>To be completed by student and internship supervisor.</p><p>It is recommended to establish at least one to two objectives within the following categories, with specific strategies for each objective. <em>If it is not possible immediately to complete together</em>, review these objectives with your internship supervisor within one week of start date.</p><p><strong>Academic Learning:</strong> ideas, concepts or theories related to major/field of study or current research.</p><p><strong>Skill Development:</strong> skills specific to major, occupation, technical, critical thinking, oral/written communication, problem solving, identification, participating in research.</p><p><strong>Personal/Professional Development:</strong> career awareness, clarification of work and professional values, self-confidence, leadership.</p><p><strong>LEARNING OBJECTIVES:</strong> Please note which category your objective falls under (see above).</p><p><em>Example</em>: I want to learn preferred methods; timing and technicalities about planting cover crops. This will enhance my academic learning within soil quality, and increase my technical skill development. By the end of fall, I hope to have learned about two new crops.</p><p><em>Example</em>: I would like to increase my professional development and career awareness by experiencing a new area of the industry.</p>'
    '1_31':
      '#type': textarea
      '#title_display': inline
      '#title': 1)
    '2_31':
      '#type': textarea
      '#title_display': inline
      '#title': 2)
    '3_31':
      '#type': textarea
      '#title_display': inline
      '#title': 3)
    '4_31':
      '#type': textarea
      '#title_display': inline
      '#title': 4)
    '5_31':
      '#type': textarea
      '#title_display': inline
      '#title': 5)
    additional_requirements_31:
      '#type': processed_text
      '#format': full_html
      '#text': '<p>A. ADDITIONAL REQUIREMENTS</p><p>Please describe here regular interactions, responsibilities and measures by which student will interact with employer in the day to day. Please also describe if there are additional evaluations and their criteria that go along with these responsibilities.</p>'
    student_responsibilities_31:
      '#type': textarea
      '#title': 'Student Responsibilities'
      '#required': true
    employer_responsibilities_31:
      '#type': textarea
      '#title': 'Employer Responsibilities'
      '#required': true

id: mycas_prof_dev_series_open_first_accordion
label: 'MyCAS Prof Dev series: open first accordion'
code: |-
  (function (Drupal) {
    Drupal.behaviors.casOpenFirstAccordion = {
      attach: function (context) {
        var accordion = context.querySelector ? context.querySelector('.accordion') : null;
        if (!accordion || accordion.dataset.firstOpened) {
          return;
        }
        accordion.dataset.firstOpened = '1';

        var panel = accordion.querySelector('.accordion-collapse');
        var button = accordion.querySelector('.accordion-button');
        if (!panel || !button) {
          return;
        }
        panel.classList.add('show');
        button.classList.remove('collapsed');
        button.setAttribute('aria-expanded', 'true');
      }
    };
  })(Drupal);

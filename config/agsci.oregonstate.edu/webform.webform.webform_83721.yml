elements: |-
  introduction:
    '#type': processed_text
    '#format': full_html
    '#text': '<p><strong><span>Registration is now closed.</span></strong></p><p><strong>Principles of Vineyard Management - Spring 2018</strong></p><p>This non-credit online course will cover the most relevant principles of vineyard production from vineyard design to pest management. Online participants will learn jointly with upper division students at Oregon State University who are taking this course as part of&nbsp;the B.S. in Horticulture Degree, with an option in Viticulture and Enology.&nbsp;This course provides professional development for industry members seeking continuing education or for those new to vineyard and winery production. Focus will be placed on the importance of making informed vineyard management decisions by understanding impacts on grapevine physiology, sustainability, and economics.</p><p>Major topics to be covered include vineyard site selection and design, nutrient management, irrigation management, canopy management, vineyard floor management, pest management, managing fruit yield and quality, harvest operations, vineyard technology, labor and economics.</p><p><strong>Dates and Times</strong> - Registration closes 08:00 am, March 23, 2018</p><p>Tuesdays and Thursdays,&nbsp;April 3 to June 7, 2018<br>Lectures are held 8:00 -&nbsp;9:50 AM PST</p><p>This course will be offered online. Once registered, you will be contacted with connection details for the online classroom. Those who live/work in close proximity to the OSU main campus (Corvallis) must check with the instructor if they choose to participate in the classroom rather than online.</p><p><strong>Registration fee</strong></p><p>$500 (on or before March 16, 2018), $600 (March 17 - March 23, 2018)</p><p>For more details on this course, please see the course <a href="http://horticulture.oregonstate.edu/system/files/u178/brochure_1_Sp2018_vit_course.pdf" data-cke-saved-href="/system/files/u178/brochure_1_Sp2018_vit_course.pdf">brochure</a>.</p>'

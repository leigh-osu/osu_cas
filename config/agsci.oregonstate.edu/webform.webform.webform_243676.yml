    '#type': processed_text
    '#format': full_html
    '#text': |-
      <p>
      	Only choose the top&nbsp;<strong>two</strong>&nbsp;Beginning Research projects that you are interested in. The next question in the survey provides the titles of the research projects. Please read the details regarding location, work hours per week, hourly pay rate to help you make your decision at&nbsp;<a href="https://agsci.oregonstate.edu/education/beginning-researchers-support-program/available-internships" style="color: rgb(54, 108, 204); font-family: Gudea, sans-serif; font-size: 18px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: left; text-indent: 0px; text-transform: none; white-space: normal; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; background-color: rgb(255, 255, 255);">beginning-researchers-support-program/available-internships.</a></p>
  1st_choice_project:
    '#type': radios
    '#options':
      1biocontrol: 'Biocontrol potential of native entomopathogenic nematodes for insect management in Oregon seed crops'
      1dissecting: 'Dissecting the thiamin-mediated biotic defense response pathway in plants'
      1seasonal: 'Seasonal application timing effects on the availability of sulfur-based fertilizers in soil'
      1tunnels: 'Tunnels for Organic Strawberry Season Extension'
      1grapesmoke: 'Grape smoke exposure effects: Determining the compounds that cause smoke impacts in wine'
      1geisha: 'Impact of Different roasting profiles to the floral aroma of Geisha coffee'
      1smartrock: 'Smart Rock: IoT Environmental Sensing in the OPEnS Lab'
      1dendrometer: 'Dendrometer: IoT Environmental Sensing in the OPEnS Lab'
      1weatherchimes: 'WeatherChimes: IoT Environmental Sensing in the OPEnS Lab'
      1loom: 'Loom: Programming for IoT Environmental Sensing in the OPEnS Lab'
      1food: 'Addressing food deserts with common gardens'
      1coupling: 'Coupling ecosystem structure to habitat microclimate through GEDI derived canopy water storage estimates'
    '#title': '1st Choice Project'
    '#required': true
  2nd_choice_project:
    '#type': radios
    '#options':
      2biocontrol: 'Biocontrol potential of native entomopathogenic nematodes for insect management in Oregon seed crops'
      2dissecting: 'Dissecting the thiamin-mediated biotic defense response pathway in plants'
      2seasonal: 'Seasonal application timing effects on the availability of sulfur-based fertilizers in soil'
      2tunnels: 'Tunnels for Organic Strawberry Season Extension'
      2grapesmoke: 'Grape smoke exposure effects: Determining the compounds that cause smoke impacts in wine'
      2geisha: 'Impact of Different roasting profiles to the floral aroma of Geisha coffee'
      2smartrock: 'Smart Rock: IoT Environmental Sensing in the OPEnS Lab'
      2dendrometer: 'Dendrometer: IoT Environmental Sensing in the OPEnS Lab'

      2loom: 'Loom: Programming for IoT Environmental Sensing in the OPEnS Lab'
      2food: 'Addressing food deserts with common gardens'
      2coupling: 'Coupling ecosystem structure to habitat microclimate through GEDI derived canopy water storage estimates'
    '#title': '2nd Choice Project'
    '#required': true
  cover_letter:
    '#type': managed_file
    '#max_filesize': 2.0
    '#file_extensions': pdf
    '#title': 'Cover Letter'
    '#description': 'If the title of your COVER LETTER does not include your last name, please rename your document to include your last name then upload a PDF of your COVER LETTER (PDF)'
  resume:

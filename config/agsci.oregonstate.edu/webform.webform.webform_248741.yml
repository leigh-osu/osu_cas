    '#text': |-
      <p>
      	See what’s brewing with OSU’s College of Agricultural Sciences and Crux Fermentation Project.</p>

      <p>
      	<strong>Date</strong>: October 22<sup>nd</sup>, 2022<br />
      	<strong>Time</strong>: 2:00pm doors open, 5:00pm kickoff at Reser Stadium<br />
      	<strong>Place</strong>: <a href="https://goo.gl/maps/XUK1pZ5DgJuJKmJh8">CH2M Hill Alumni Center patio</a></p>

      <p>
      	The first 100 to sign up for the event will each receive ONE FREE drink ticket to be used at OSUAA Tailgate Town.</p>

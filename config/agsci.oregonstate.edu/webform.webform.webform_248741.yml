        [webform_submission:values:first_name] [webform_submission:values:last_name],

        Thank you for registering to attend the OSU and Crux Fermentation Project Tailgate before the 10/22 home football game against Colorado. Please save these details below for your reference leading up to the event:

        Tailgate doors open at 2:00pm
        Kickoff begins at 5:00pm

        CH2M Hill Alumni Center, Patio
        725 SW 26th Street
        Corvallis, OR 97331
        <a href="https://www.google.com/maps/place/CH2M+HILL+Alumni+Center/@44.5599209,-123.2789587,17z/data=!3m1!4b1!4m5!3m4!1s0x54c040c7ff9ab0e1:0x4638f38509df6437!8m2!3d44.5599209!4d-123.2789587">View Map</a>

        To check-in: Please check-in at the main OSU Alumni Association registration table (as you enter the Alumni Association building main doors). You will be directed to the patio and receive your free drink ticket if you are one of the first 100 to register. 

        If you have questions, please contact Ally Rumpakis, Director of Alumni Relations for the College of Agricultural Sciences at ally.rumpakis@osualum.com. 
        We look forward to seeing you there, Go Beavs!

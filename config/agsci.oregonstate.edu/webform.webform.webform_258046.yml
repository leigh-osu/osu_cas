elements: |-
  introduction:
    '#type': processed_text
    '#text': |
      <drupal-media data-entity-type="media" data-entity-uuid="34e427cd-4f62-442e-9a27-72e77b74aac0"></drupal-media>

      <p>&nbsp;<br />
      You are invited to join your College of Agricultural Sciences community for our State of the College event on October 7, 2026 at 3pm.</p>

      <p style="margin-left:40px">State of the College<br />
      Alumni Center Ballroom<br />
      <strong>Wednesday, October 7, 2026</strong><br />
      <strong>3pm - 4pm:</strong> Dean’s presentation, panel session, conversation with an invited guest<br />
      <strong>4pm - 5pm:</strong> Reception with food and beverages</p>

      <p>This event is open to all staff, faculty and students who call the College of Agricultural Sciences home. This is an opportunity to hear directly from College leadership about priorities and goals as they align with our core strengths and values as well as the University’s strategic plan. You will also have the opportunity to submit specific questions in advance that you would like our panel of Associate Deans to address.&nbsp;</p>

      <p>The panel will be moderated by Dean Staci Simonich following her presentation and will include:</p>

      <p style="margin-left: 40px;"><strong>Shawn Donkin</strong>: Associate Dean, Research<br />
      <strong>Nadia Singh</strong>: Associate Dean, Inclusive Excellence &amp; Faculty Affairs<br />
      <strong>Sam Angima</strong>: Associate Dean, Extension<br />
      <strong>Jia Hu</strong>: Associate Dean, Academic Programs<br />
      <strong>Dave Stone</strong>: Associate Dean, International Programs</p>

      <p>Following the panel, <strong>Ruben Rathnasingham</strong>, Executive Director, Huang Collaborative Innovation Complex, will join Dean Staci Simonich to talk about the new supercomputer and how CAS can collaborate.</p>

      <p>Registration is required for both remote and in-person attendees. Please register and submit any questions you would like addressed below.&nbsp;</p>

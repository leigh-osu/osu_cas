  recent_publications:
    '#type': textarea
    '#title': 'If a publication, please provide the citation.  What was its primary contribution, in layman’s terms?'
    '#states':
      visible:
        - ':input[name="is_there_a_recent_publication_or_grant[publication]"]':
            checked: true
  recent_grant:
    '#type': textarea
    '#title': 'If a grant, please provide the title, funding agency and amount.  What are the primary goals of the project, in layman’s terms?'
    '#states':
      visible:
        - ':input[name="is_there_a_recent_publication_or_grant[grant]"]':
            checked: true
  who_developed_project:
    '#type': textarea

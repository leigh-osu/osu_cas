id: scholarship_thank_you_letters
label: 'Scholarship thank-you letters: rotate photos'
code: |
  /* Scholarship thank-you letters: click a letter photo to rotate it 90° for
   * printing. Only the on-screen orientation changes; nothing is saved. */
  jQuery(document).ready(function ($) {
    $('.rotate img').on('click', function () {
      var img = this;
      if (!img.dataset.width || !img.dataset.height) {
        img.dataset.width = img.clientWidth;
        img.dataset.height = img.clientHeight;
      }
      var width = parseInt(img.dataset.width, 10);
      var height = parseInt(img.dataset.height, 10);
      var angle = (parseInt(img.dataset.angle || 0, 10) + 90) % 360;
      img.className = 'rotate' + angle;
      img.dataset.angle = angle;
      if (angle === 90 || angle === 270) {
        img.parentNode.style.width = width + 'px';
        img.parentNode.style.height = width * width / height + 'px';
        img.style.height = width + 'px';
        img.style.width = width * width / height + 'px';
      }
      else {
        img.parentNode.style.width = width + 'px';
        img.parentNode.style.height = height + 'px';
        img.style.height = height + 'px';
        img.style.width = width + 'px';
      }
    });
  });

title: 'Financial Hardship Grant Form'
description: null
categories: {  }
elements: |-
  introduction:
    '#type': processed_text
    '#format': full_html
    '#text': |-
      <p>
      	<strong>Application note:</strong> Please note this award must first be applied to any outstanding student account balance you may have. This will help your financial status with the university with the intention of avoiding a financial hold interfering with your ability to register in a future term. If funding from your award exceeds an amount owed, the remaining amount will be issued to you directly in the form of a check or direct deposit if you have already established this process with the university.</p>

      <div>
      	<strong><strong>Asterisks (*) indicate required information.</strong></strong></div>

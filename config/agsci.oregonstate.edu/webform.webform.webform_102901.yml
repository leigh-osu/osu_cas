    '#title': 'Student ID'
    '#required': true
  student_status:
    '#type': checkboxes
    '#options':
      status1: 'CAS undergraduate degree-seeking student'
      status2: 'Currently enrolled with 6 or more Oregon State credits'
    '#multiple': true
    '#title_display': inline
    '#title': 'Student status:'
    '#required': true
  amount_requested:
    '#type': textfield
    '#title_display': inline
    '#title': 'Amount requested '
    '#description': '(up to $1000)'
    '#required': true
  description_of_need:

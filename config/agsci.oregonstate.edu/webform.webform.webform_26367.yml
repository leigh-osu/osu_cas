      int_anrs: 'Animal Sciences'
      int_ag-food-bm: 'Agricultural Food Business Management'
      int_brr: 'Bioresource Research'
      int_bio-data: 'Biological Data Sciences'
      int_botany: Botany
      int_css: 'Crop and Soil Sciences'
      int_envi-eco-pol: 'Environmental Economics and Policy'
      int_foodsci: 'Food Science and Technology'
      int_fw: 'Fisheries and Wildlife Sciences'
      int_hort: Horticulture
      int_rangeland: 'Rangeland Sciences'
      int_sustainability: Sustainability

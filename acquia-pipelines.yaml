version: 1.3.0

services:
  php:
    version: 8.3

variables:
  global:
    GITHUB_TOKEN: ${GITHUB_TOKEN}

events:
  build:
    steps:
      - setup:
          script:
            - composer config --global github-oauth.github.com ${GITHUB_TOKEN}

      - composer:
          script:
            - composer validate --no-check-all --ansi
            - composer install --no-progress --optimize-autoloader --no-dev

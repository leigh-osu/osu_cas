version: 1.3.0

services:
  php:
    version: 8.3

variables:
  global:
    GITHUB_TOKEN:
      secure: 

events:
  build:
    steps:
      - setup:
          script:
            - echo "{\"github-oauth\":{\"github.com\":\"${GITHUB_TOKEN}\"}}" > auth.json

      - composer:
          script:
            - composer validate --no-check-all --ansi
            - composer install --no-progress --optimize-autoloader --no-dev

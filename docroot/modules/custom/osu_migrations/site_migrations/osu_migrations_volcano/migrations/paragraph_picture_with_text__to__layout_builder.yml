id: paragraph_picture_with_text__to__layout_builder
label: Drupal 7 paragraph_picture_with_text Paragraphs
migration_group: paragraphs_to_layout_builder
dependencies: { }
migration_tags:
  - Drupal 7
  - Content
  - Layout content
  - OSU Paragraphs
  - OSU
  - Volcano
source:
  plugin: d7_paragraphs_item
  bundle: picture_with_text
  key: migrate
process:
  type:
    plugin: default_value
    default_value: 'picture_with_text'
  info:
    plugin: default_value
    default_value: 'Migrated d7 paragraph paragraph_picture_with_text'
  body:
    - plugin: sub_process
      source: field_text_with_image
      process:
        value:
          plugin: osu_media_wysiwyg_filter
          source: value
        format:
          plugin: default_value
          default_value: 'full_html'
  field_c_block_image:
    - plugin: sub_process
      source: field_image_with_text
      process:
        target_id:
          plugin: migration_lookup
          migration: upgrade_d7_media_images
          source: fid
  reusable:
    plugin: default_value
    default_value: 0

destination:
  plugin: entity:block_content

migration_dependencies:
  required: [ ]
  optional: [ ]

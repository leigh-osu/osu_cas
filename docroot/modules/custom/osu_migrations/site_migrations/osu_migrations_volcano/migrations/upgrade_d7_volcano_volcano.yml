langcode: en
status: true
dependencies: { }
id: upgrade_d7_volcano_volcano
migration_tags:
  - Drupal 7
  - Volcano
  - OSU Content
  - OSU
source:
  plugin: d7_node
  node_type: volcano
process:
  nid: nid
  title: title
  uid:
    - plugin: migration_lookup
      migration: upgrade_d7_users_with_roles
      source: node_uid
      no_stub: true
    - plugin: default_value
      default_value: 1
  body:
    - plugin: sub_process
      source: body
      process:
        value:
          plugin: osu_media_wysiwyg_filter
          source: value
        summary: summary
        format:
          plugin: default_value
          default_value: 'full_html'
  field_articles:
    - plugin: field_link
      uri_scheme: 'https://'
      source: field_articles
  field_region:
    plugin: sub_process
    source: field_region
    process:
      target_id:
        plugin: migration_lookup
        migration: upgrade_d7_taxonomy_terms
        source: target_id
  field_elevation: field_elevation
  field_map:
    - plugin: field_link
      uri_scheme: 'https://'
      source: field_map
  field_volckeywords:
    plugin: sub_process
    source: field_volckeywords
    process:
      target_id:
        plugin: migration_lookup
        migration: upgrade_d7_taxonomy_terms
        source: target_id
  field_latitude: field_latitude
  field_longitude: field_longitude
  field_images:
    - plugin: field_link
      uri_scheme: 'https://'
      source: field_images
  field_state: field_state
  field_type:
    plugin: sub_process
    source: field_type
    process:
      target_id:
        plugin: migration_lookup
        migration: upgrade_d7_taxonomy_terms
        source: target_id
  field_upload:
    plugin: sub_process
    source: field_upload
    process:
      target_id:
        - plugin: migration_lookup
          migration: upgrade_d7_files
          source: fid
  field_meta_tags:
    - plugin: d7_metatag_entities
      source: pseudo_metatag_entities
  type:
    plugin: default_value
    default_value: volcano
  status: status
  created: created
  changed: changed
  comment: comment
  promote: promote
  sticky: sticky
  path/pathauto:
    plugin: default_value
    default_value: 0
destination:
  plugin: 'entity:node'
migration_dependencies:
  required:
    - upgrade_d7_files
    - upgrade_d7_media_images
    - upgrade_d7_users_with_roles
    - upgrade_d7_taxonomy_terms
  optional:
    - upgrade_d7_media_audio
    - upgrade_d7_media_documents
    - upgrade_d7_media_local_video
    - upgrade_d7_media_kaltura
    - upgrade_d7_media_remote_video

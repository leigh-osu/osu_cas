langcode: en
status: true
dependencies: { }
id: upgrade_d7_volcano_news
migration_tags:
  - Drupal 7
  - Volcano
  - OSU Content
  - OSU
source:
  plugin: d7_node
  node_type: news
process:
  nid: nid
  title: title
  uid:
    - plugin: migration_lookup
      migration: upgrade_d7_users_with_roles
      source: node_uid
      no_stub: true
    - plugin: default_value
      default_value: 1
  body:
    - plugin: sub_process
      source: body
      process:
        value:
          plugin: osu_media_wysiwyg_filter
          source: value
        summary: summary
        format:
          plugin: default_value
          default_value: 'full_html'
  field_news_caption: field_news_caption
  field_file_upload:
    plugin: sub_process
    source: field_file_upload
    process:
      target_id:
        - plugin: migration_lookup
          migration: upgrade_d7_files
          source: fid
      alt: alt
  field_external_url:
    - plugin: field_link
      uri_scheme: 'https://'
      source: field_external_url
  field_publication_date:
    plugin: sub_process
    source: field_publication_date
    process:
      value:
        plugin: format_date
        from_format: 'Y-m-d H:i:s'
        to_format: 'Y-m-d'
        from_timezone: 'America/Los_Angeles'
        to_timezone: 'UTC'
        source: value
      end_value:
        plugin: format_date
        from_format: 'Y-m-d H:i:s'
        to_format: 'Y-m-d'
        from_timezone: 'America/Los_Angeles'
        to_timezone: 'UTC'
        source: value2
  field_source: field_source
  field_news_thumbnail:
    plugin: sub_process
    source: field_news_thumbnail
    process:
      target_id:
        - plugin: migration_lookup
          migration: upgrade_d7_files
          source: fid
      alt: alt
  field_newsvolcano:
    plugin: sub_process
    source: field_newsvolcano
    process:
      target_id:
        plugin: migration_lookup
        migration: upgrade_d7_volcano_volcano
        source: target_id
  field_meta_tags:
    - plugin: d7_metatag_entities
      source: pseudo_metatag_entities
  type:
    plugin: default_value
    default_value: news
  status: status
  created: created
  changed: changed
  comment: comment
  promote: promote
  sticky: sticky
  path/pathauto:
    plugin: default_value
    default_value: 0
destination:
  plugin: 'entity:node'
migration_dependencies:
  required:
    - upgrade_d7_files
    - upgrade_d7_media_images
    - upgrade_d7_users_with_roles
    - upgrade_d7_taxonomy_terms
    - upgrade_d7_volcano_volcano
  optional:
    - upgrade_d7_media_audio
    - upgrade_d7_media_documents
    - upgrade_d7_media_local_video
    - upgrade_d7_media_kaltura
    - upgrade_d7_media_remote_video

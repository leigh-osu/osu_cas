langcode: en
status: true
dependencies: { }
id: upgrade_d7_iifet_supporters
migration_group: IIFET
migration_tags:
  - Drupal 7
  - IIFET
  - OSU Content
  - OSU
source:
  plugin: d7_node
  node_type: supporters
process:
  nid: nid
  title: title
  status: status
  created: created
  changed: changed
  comment: comment
  promote: promote
  sticky: sticky
  path/pathauto:
    plugin: default_value
    default_value: 0
  uid:
    - plugin: migration_lookup
      migration: upgrade_d7_users_with_roles
      source: node_uid
      no_stub: true
    - plugin: default_value
      default_value: 1
  # Custom Fields
  field_supporter_additional_info:
    - plugin: sub_process
      source: field_supporter_additional_info
      process:
        value:
          plugin: osu_media_wysiwyg_filter
          source: value
        format:
          plugin: default_value
          default_value: 'full_html'
  field_current_supporter: field_current_supporter
  field_supporter_image:
    plugin: sub_process
    source: field_supporter_image
    process:
      target_id:
        - plugin: migration_lookup
          migration: upgrade_d7_files
          source: fid
      alt: alt
  field_name_link:
    - plugin: field_link
      uri_scheme: 'https://'
      source: field_name_link
  field_supporter_type: field_supporter_type
  # End custom Fields
  type:
    plugin: default_value
    default_value: supporters
destination:
  plugin: 'entity:node'
migration_dependencies:
  required:
    - upgrade_d7_files
    - upgrade_d7_media_images
    - upgrade_d7_users_with_roles
    - upgrade_d7_taxonomy_terms
  optional:
    - upgrade_d7_media_audio
    - upgrade_d7_media_documents
    - upgrade_d7_media_local_video
    - upgrade_d7_media_kaltura
    - upgrade_d7_media_remote_video

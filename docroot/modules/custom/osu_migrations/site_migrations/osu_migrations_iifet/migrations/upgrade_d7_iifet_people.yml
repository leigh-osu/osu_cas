langcode: en
status: true
dependencies: { }
id: upgrade_d7_iifet_people
migration_group: IIFET
migration_tags:
  - Drupal 7
  - IIFET
  - OSU Content
  - OSU
source:
  plugin: d7_node
  node_type: people
process:
  nid: nid
  title: title
  status: status
  created: created
  changed: changed
  comment: comment
  promote: promote
  sticky: sticky
  path/pathauto:
    plugin: default_value
    default_value: 0
  uid:
    - plugin: migration_lookup
      migration: upgrade_d7_users_with_roles
      source: node_uid
      no_stub: true
    - plugin: default_value
      default_value: 1
  # Custom Fields
  field_address: field_address
  field_email: field_email
  field_fax_number: field_fax_number
  field_people_first_name: field_people_first_name
  field_iifet_administrative_depar: field_iifet_administrative_depar
  field_iifet_administrative_posit: field_iifet_administrative_posit
  field_people_last_name: field_people_last_name
  field_name_prefix: field_name_prefix
  field_order_number: field_order_number
  field_department: field_department
  field_person_s_title: field_person_s_title
  field_phone_number: field_phone_number
  field_photo:
    plugin: sub_process
    source: field_photo
    process:
      target_id:
        - plugin: migration_lookup
          migration: upgrade_d7_files
          source: fid
      alt: alt
  field_position: field_position
  field_secondary_email: field_secondary_email
  field_term: field_term
  field_current_supporter: field_current_supporter
  # End custom Fields
  type:
    plugin: default_value
    default_value: people
destination:
  plugin: 'entity:node'
migration_dependencies:
  required:
    - upgrade_d7_files
    - upgrade_d7_media_images
    - upgrade_d7_users_with_roles
    - upgrade_d7_taxonomy_terms
  optional:
    - upgrade_d7_media_audio
    - upgrade_d7_media_documents
    - upgrade_d7_media_local_video
    - upgrade_d7_media_kaltura
    - upgrade_d7_media_remote_video

langcode: en
status: true
dependencies: { }
id: upgrade_d7_iifet_home_page_gallery
migration_group: IIFET
migration_tags:
  - Drupal 7
  - IIFET
  - OSU Content
  - OSU
source:
  plugin: d7_node
  node_type: home_page_gallery
process:
  nid: nid
  title: title
  status: status
  created: created
  changed: changed
  comment: comment
  promote: promote
  sticky: sticky
  path/pathauto:
    plugin: default_value
    default_value: 0
  uid:
    - plugin: migration_lookup
      migration: upgrade_d7_users_with_roles
      source: node_uid
      no_stub: true
    - plugin: default_value
      default_value: 1
  # Custom Fields
  field_home_page_photo:
    plugin: sub_process
    source: field_home_page_photo
    process:
      target_id:
        - plugin: migration_lookup
          migration: upgrade_d7_files
          source: fid
      alt: alt
  # End custom Fields
  type:
    plugin: default_value
    default_value: home_page_gallery
destination:
  plugin: 'entity:node'
migration_dependencies:
  required:
    - upgrade_d7_files
    - upgrade_d7_media_images
    - upgrade_d7_users_with_roles
    - upgrade_d7_taxonomy_terms
  optional:
    - upgrade_d7_media_audio
    - upgrade_d7_media_documents
    - upgrade_d7_media_local_video
    - upgrade_d7_media_kaltura
    - upgrade_d7_media_remote_video

services:
  _defaults:
    autoconfigure: true
    autowire: true

  plugin.manager.node_revision_delete:
    class: Drupal\node_revision_delete\Plugin\NodeRevisionDeletePluginManager
    parent: default_plugin_manager
    arguments:
      - '@entity_type.manager'
      - '@config.factory'

  node_revision_delete.batch:
    class: Drupal\node_revision_delete\NodeRevisionDeleteBatch

  node_revision_delete:
    class: Drupal\node_revision_delete\NodeRevisionDelete
    arguments:
      - '@entity_type.manager'
      - '@language_manager'
      - '@database'
      - '@plugin.manager.node_revision_delete'
      - '@queue'

  Drupal\node_revision_delete\NodeRevisionDeleteInterface: '@node_revision_delete'

  Drupal\node_revision_delete\EventSubscriber\ConfigSubscriber: ~

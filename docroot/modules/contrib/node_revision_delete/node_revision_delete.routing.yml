node_revision_delete.admin_settings:
  path: '/admin/config/content/node_revision_delete'
  defaults:
    _form: '\Drupal\node_revision_delete\Form\AdminSettingsForm'
    _title: 'Node Revision Delete'
  requirements:
    _permission: 'administer node_revision_delete'

node_revision_delete.reset_node_type:
  path: '/admin/config/content/node_revision_delete/reset/{node_type}'
  defaults:
    _form: '\Drupal\node_revision_delete\Form\ResetNodeTypeForm'
    _title: 'Reset to defaults'
  requirements:
    _permission: 'administer node_revision_delete'
  options:
    parameters:
      node_type:
        type: entity:node_type

node_revision_delete.queue:
  path: '/admin/config/content/node_revision_delete/queue'
  defaults:
    _form: '\Drupal\node_revision_delete\Form\QueueForm'
    _title: 'Queue'
  requirements:
    _permission: 'administer node_revision_delete'

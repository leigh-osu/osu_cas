site_name: Domain Extras
repo_url: https://git.drupalcode.org/project/domain_extras
repo_name: drupal/domain_extras
theme:
  name: material
  logo: logo.png
  favicon: favicon.png
  icon:
    repo: fontawesome/brands/gitlab
  palette:
    primary: blue
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.path
    - navigation.top
    - toc.follow
extra:
  generator: false
extra_css:
  - css/pygments.css
plugins:
  - privacy:
      enabled: !ENV [CI, false]
  - search
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

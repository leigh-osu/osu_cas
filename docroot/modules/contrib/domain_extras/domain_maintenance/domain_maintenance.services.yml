services:
  _defaults:
    autowire: true

  Drupal\domain_maintenance\Hook\DomainMaintenanceHooks:
    arguments:
      $domainConfigUiManager: '@domain_config_ui.manager'
      $state: '@state'

  # Override core maintenance mode service.
  maintenance_mode:
    class: Drupal\domain_maintenance\Service\DomainMaintenanceMode

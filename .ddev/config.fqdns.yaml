# Local domain-access testing.
#
# Serves every Domain module record's hostname under a "ddev." prefix
# (e.g. ddev.bee.oregonstate.edu) so the REAL production hostnames stay
# resolvable on the internet for side-by-side comparison.
#
# DDEV adds these prefixed names to /etc/hosts (pointing at 127.0.0.1) and
# generates a local mkcert TLS cert covering them, so https://ddev.<host> works.
#
# The matching Domain records are pointed at these same "ddev." hostnames
# locally via a config override loop in
#   docroot/sites/agsci.oregonstate.edu/settings.local.php
# so the Domain module negotiates the correct domain and generates local links.
#
# Hostnames mirror config/agsci.oregonstate.edu/domain.record.*.yml.
# Regenerate with:
#   grep -h '^hostname:' config/agsci.oregonstate.edu/domain.record.*.yml \
#     | awk '{print "  - ddev."$2}' | sort
additional_fqdns:
  - ddev.agbiotech.oregonstate.edu
  - ddev.agsci.oregonstate.edu
  - ddev.anrs.oregonstate.edu
  - ddev.appliedecon.oregonstate.edu
  - ddev.bee.oregonstate.edu
